<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F9" />
    <script>
      // تطبيق وضع المستخدم قبل أي رسم لمنع وميض الوضع الخاطئ
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('erp.session') || 'null');
          var raw = localStorage.getItem('erp.appearance.' + (s && s.user ? s.user.id : 'guest')) || localStorage.getItem('erp.appearance');
          var a = raw ? JSON.parse(raw) : {};
          var m = a.theme === 'auto' ? 'system' : a.theme || 'system';
          var dark = m === 'dark' || ((m === 'system') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var d = document.documentElement;
          d.dataset.theme = dark ? 'dark' : 'light';
          d.dataset.accent = a.accent || 'blue';
          d.dataset.font = a.font || 'plex';
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>نظام الحسابات والمخازن</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
