<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F9" />
    <script>
      // تطبيق وضع المستخدم قبل أي رسم لمنع وميض الوضع الخاطئ
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('erp.session') || 'null');
          var raw = localStorage.getItem('erp.appearance.' + (s && s.user ? s.user.id : 'guest')) || localStorage.getItem('erp.appearance');
          var a = raw ? JSON.parse(raw) : {};
          var m = a.theme === 'auto' ? 'system' : (a.theme === 'sky' || a.theme === 'olive') ? 'light' : a.theme || 'system';
          var pal = ['navy', 'amber', 'teal', 'paprika', 'sage', 'coral'].indexOf(m) >= 0;
          var dark = m === 'dark' || ((m === 'system') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var d = document.documentElement;
          d.dataset.theme = pal ? m : dark ? 'dark' : 'light';
          d.dataset.accent = a.accent && a.accent !== 'olive' ? a.accent : 'sky';
          d.dataset.font = a.font || 'plex';
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Eco System</title>
  </head>
  <body>
    <!-- شاشة البداية: بتظهر لحد ما الواجهة تشتغل، وReact بيشيلها لوحده لما يرسم السيستم -->
    <div id="root"><div class="eco-splash" role="status" aria-label="جاري فتح السيستم">
      <style>
        .eco-splash{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-family:"Segoe UI",Tahoma,sans-serif;color:#E5E7EB;background:radial-gradient(120% 90% at 50% 0%,#1E293B 0%,#0F1115 60%);z-index:9999}
        .eco-logo{position:relative;width:88px;height:88px;margin:0 auto 20px}
        .eco-logo img{position:relative;z-index:1;width:88px;height:88px;object-fit:contain;border-radius:20px;animation:eco-pop .7s cubic-bezier(.2,.9,.3,1.3) both}
        .eco-logo i{position:absolute;inset:-9px;border-radius:28px;border:2px solid #3B82F6;opacity:0;animation:eco-ring 2.2s ease-out infinite}
        .eco-logo i+i{animation-delay:1.1s}
        .eco-name{margin:0;font-size:32px;font-weight:800;letter-spacing:1px;direction:ltr;background:linear-gradient(90deg,#60A5FA,#34D399,#A78BFA,#60A5FA);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:eco-shine 4s linear infinite}
        .eco-co{margin-top:6px;font-size:14px;color:#9CA3AF;min-height:18px}
        .eco-bar{position:relative;height:4px;width:220px;margin:26px auto 0;border-radius:99px;background:#ffffff14;overflow:hidden}
        .eco-bar b{position:absolute;inset:0 auto 0 0;width:40%;border-radius:99px;background:linear-gradient(90deg,#3B82F6,#34D399);animation:eco-slide 1.3s ease-in-out infinite}
        @keyframes eco-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
        @keyframes eco-ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}
        @keyframes eco-shine{to{background-position:300% 0}}
        @keyframes eco-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
        @media (prefers-reduced-motion:reduce){.eco-splash *{animation:none!important}}
      </style>
      <div>
        <div class="eco-logo"><i></i><i></i><img id="eco-logo" src="/eco-logo.svg" alt="" /></div>
        <div class="eco-name" id="eco-name">Eco System</div>
        <div class="eco-co" id="eco-co"></div>
        <div class="eco-bar"><b></b></div>
      </div>
      <script>
        // لوجو واسم الشركة واسم النظام من آخر نسخة محفوظة على الجهاز (من الإعدادات)
        (function () {
          try {
            var b = JSON.parse(localStorage.getItem('erp.brand.v1') || 'null');
            if (!b) return;
            if (b.system_name) document.getElementById('eco-name').textContent = b.system_name;
            if (b.company_name) document.getElementById('eco-co').textContent = b.company_name;
          } catch (e) {}
        })();
      </script>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
