# PostgreSQL للإنتاج أو لاختبار النظام على قاعدة بيانات حقيقية
# التشغيل: docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - erp-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  erp-pg:
